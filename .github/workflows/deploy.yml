name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"] # Or your default branch
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      # React Router v7 SPA mode outputs to build/client
      # We add a 404.html to handle client-side routing refreshes
      - name: Setup Pages Artifacts
        run: |
          cp build/client/sudoku-helper/index.html build/client/404.html
          cp build/client/sudoku-helper/index.html build/client/index.html
          touch build/client/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'build/client'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
